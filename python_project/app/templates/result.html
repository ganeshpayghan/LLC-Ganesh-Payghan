<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ person }} - Biography</title>
    <script src="https://kit.fontawesome.com/323f5027df.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-start: #0f2027;
            --bg-mid:   #203a43;
            --bg-end:   #2c5364;
            --text:      #eaf2f8;
            --muted:     #b3c7d6;
            --accent:    #00d4ff;
            --accent-2:  #7f53ac;
            --card-bg:   rgba(255,255,255,0.08);
            --border:    rgba(255,255,255,0.12);
            --shadow:    0 10px 30px rgba(0,0,0,0.35);
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid) 45%, var(--bg-end));
            color: var(--text);
            font-family: Arial, sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .title {
            font-size: 34px;
            line-height: 1.2;
            margin: 0;
            letter-spacing: 0.3px;
        }

        .subtitle {
            margin: 6px 0 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .back-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #0b1220;
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            opacity: 0.95;
        }

        .back-btn:hover { transform: translateY(-1px); opacity: 1; }
        .back-btn:active { transform: translateY(0); }

        .icon-btn {
            background: rgba(255,255,255,0.12);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease;
            opacity: 0.95;
        }

        .icon-btn:hover { transform: translateY(-1px); opacity: 1; }
        .icon-btn:active { transform: translateY(0); }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .section {
            padding: 22px 22px 10px 22px;
        }

        .section + .section { padding-top: 0; }

        .bio {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 22px;
        }

        .bio h2 { margin: 0 0 8px 0; font-size: 22px; }
        .bio p { margin: 0; color: var(--muted); line-height: 1.6; }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .image-grid img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .section-title {
            margin: 0 0 12px 0;
            font-size: 18px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            color: #d7e6f2;
        }

        .videos {
            display: grid;
            gap: 10px;
        }

        .video-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(0,0,0,0.15);
        }

        .video-item a {
            color: var(--text);
            text-decoration: none;
        }

        .video-item a:hover { text-decoration: underline; }

        .footer-actions {
            display: flex;
            justify-content: center;
            padding: 16px 22px 22px 22px;
        }

        @media (max-width: 820px) {
            .bio { grid-template-columns: 1fr; }
            .title { font-size: 28px; }
        }
    </style>
    </head>
<body data-person="{{ person }}">
    <div class="container">
        <div class="header">
            <div>
                <h1 class="title">{{ data.title }}</h1>
                <p class="subtitle">Generated biography for <strong>{{ person }}</strong></p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="icon-btn" onclick="downloadPage()"><i class="fas fa-download"></i> Download</button>
                <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
            </div>
        </div>

        <div class="card">
            <div class="section bio">
                <div>
                    <h2>Overview</h2>
                    <p>{{ data.summary }}</p>
                </div>
                <div>
                    <h3 class="section-title">Images</h3>
                    <div class="image-grid">
                        {% for img in data.images %}
                            <img src="{{ img }}" alt="image">
                        {% endfor %}
                    </div>
                </div>
            </div>

            <div class="section">
                <h3 class="section-title">Videos</h3>
                <div class="videos">
                    {% for video in data.videos %}
                        <div class="video-item">
                            <i class="fas fa-play-circle"></i>
                            <a href="{{ video.url }}" target="_blank">{{ video.title }}</a>
                        </div>
                    {% endfor %}
                </div>
            </div>

            <div class="footer-actions">
                <a href="/" class="back-btn"><i class="fas fa-search"></i> Search again</a>
            </div>
        </div>
    </div>
    <script>
        function downloadPage() {
            try {
                var content = document.documentElement.outerHTML;
                var blob = new Blob([content], { type: 'text/html;charset=utf-8' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                var personVal = document.body.getAttribute('data-person') || 'biography';
                var sanitized = personVal.toString().trim().replace(/\s+/g, '-').replace(/[^a-z0-9\-_.]/gi, '');
                var filename = (sanitized || 'biography') + '-result.html';
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                window.print();
            }
        }
    </script>
</body>
</html>
