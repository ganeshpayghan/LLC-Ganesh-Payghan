<!DOCTYPE html>
<html lang="en">
<head>
 <script src="https://kit.fontawesome.com/323f5027df.js" crossorigin="anonymous"></script>
 <title>Python Project</title>
 <style>
 body {
  background-image: linear-gradient(to right, red, yellow, green);
  height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
 }

 /* Navbar Icons */
 .top-icons {
  position: absolute;
  top: 20px;
  width: 95%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 30px;
  color: black;
  font-size: 28px;
 }

 .top-icons i {
  cursor: pointer;
  transition: transform 0.2s;
 }

 .top-icons i:hover {
  transform: scale(1.2);
 }

 h1 {
  color: black;
  font-size: 75px;
  border-right: 3px solid white;
  white-space: nowrap;
  overflow: hidden;
  width: 0;
  animation: typing 2s steps(13) 1s forwards, blink 0.6s step-end infinite;
  margin-bottom: 50px;
 }

 .search-container {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-width: 1200px;
  position: relative;
  border-radius: 60px;
  padding:10px 20px;
 }

 .search-container input[type=text] {
  padding: 24px 24px;
  font-size: 18px;
  border: 1px solid rgba(0,0,0,0.25);
  border-radius: 40px 0 0 40px;
  outline: none;
  width: 720px;
  flex:1;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
 }

 .search-container input[type=text]:focus {
  border-color: rgba(0,0,0,0.4);
  box-shadow: 0 6px 22px rgba(0,0,0,0.12), 0 0 0 3px rgba(0,0,0,0.06);
 }

 .search-container button {
  background: white;
  color: black;
  font-size: 18px;
  border: 1px solid rgba(0,0,0,0.25);
  border-left: none;
  border-radius: 0 40px 40px 0;
  cursor: pointer;
  width: 72px;
  height: 72px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
 }

 .search-container button img{
  width: 25px;
 }

 .search-container button:hover {
  background: #f7f7f7;
 }

 @keyframes typing {
  from { width: 0; }
  to { width: 6ch; }
 }

 @keyframes blink {
  50% { border-color: transparent; }
 }
 </style>
</head>
<body>
  

  <!-- Main heading -->
  <h1><b>Hello!</b></h1>

  <!-- Search bar -->
  <div class="search-container">
    <form action="/search" method="get">
      <input type="text" placeholder="Generate biography of..." name="search" required>
      <button type="submit"><i class="fas fa-search"></i></button>
    </form>
  </div>
</body>
</html>
